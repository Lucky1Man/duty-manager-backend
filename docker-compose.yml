version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: duty_manager
      POSTGRES_USER: backend_1
      POSTGRES_PASSWORD: backend_1
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database-setup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_1 -d duty_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_ADDRESS: db
      DB_NAME: duty_manager
      DB_USERNAME: backend_1
      DB_PASSWORD: backend_1
      JWT_KEY: ${JWT_KEY:-change-this-secret-min-32-chars-long}
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      FRONTEND_ADDRESS: localhost
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose:
      - "9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
